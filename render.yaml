services:
  - type: web
    name: queuesetu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: STAFF_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: HOSPITAL_NAME
        value: Demo District Hospital
      - key: SEED_SAMPLE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DOCTORS
        sync: false
